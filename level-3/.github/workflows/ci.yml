name: AetherEdge Production CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx pydantic-settings fastapi uvicorn requests

    - name: Run Automated Health Check Unit Tests
      run: |
        python -m pytest -v

    - name: Verify Docker Container Build
      run: |
        docker build -t aetheredge-gateway:ci .